[package]
name = "ml-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "buffer-recorder"
path = "src/main.rs"

[dependencies]
ml-core = { path = "../ml-core" }
ml-eq = { path = "../ml-eq" }
ml-rgb = { path = "../ml-rgb" }
wasapi = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26.1"
# the same version wasapi pulls in (no second copy): Core Audio volume / session interfaces for the mixer
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
