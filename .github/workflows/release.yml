name: release

# Push a tag like v0.2.0 (matching src-tauri/tauri.conf.json) to build the installer and attach it to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build installer (fetches and verifies ffmpeg)
        shell: pwsh
        run: ./build-installer.ps1

      - name: Test
        run: cargo test --workspace

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" $installer.FullName `
            --title "Buffer ${{ github.ref_name }}" `
            --notes "SHA-256 of $($installer.Name): $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
