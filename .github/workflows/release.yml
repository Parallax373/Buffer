name: release

# Push a tag like v0.2.0 (it must match the version in src-tauri/tauri.conf.json) to build the installer,
# sign the update package and publish both with latest.json, the feed the in-app updater reads.
#
# Required repository secrets (see RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY            contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --exclude buffer   # the app crate needs the release recorder and ffmpeg resources, which the installer build creates

      - name: Build installer (fetches and verifies ffmpeg, signs the update package)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build-installer.ps1 -Sign

      - name: Update feed
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force target/release/bundle/feed | Out-Null
          Push-Location target/release/bundle/feed
          & "$env:GITHUB_WORKSPACE/scripts/make-latest-json.ps1" -Version $version -Installer $installer.FullName -Notes "Buffer $version" -Repo "${{ github.repository }}"
          Pop-Location

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" $installer.FullName "$($installer.FullName).sig" target/release/bundle/feed/latest.json `
            --title "Buffer ${{ github.ref_name }}" `
            --notes "SHA-256 of $($installer.Name): $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
