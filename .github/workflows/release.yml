name: release

# Push a tag like v0.2.0 (it must match the version in src-tauri/tauri.conf.json) to build the installer,
# sign the update package and publish both with latest.json, the feed the in-app updater reads.
#
# A release published from the maintainer's machine (scripts/release.ps1 -Local) creates its tag too, which starts
# this workflow: it finds the release already there and finishes green without building anything.
#
# Required repository secrets (see RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY            contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Already released?
        id: guard
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists (published from the maintainer's machine): nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Release notes are there and in the format
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version | Out-Null

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Rust toolchain
        if: steps.guard.outputs.skip != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Cache Rust build
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Test
        if: steps.guard.outputs.skip != 'true'
        run: cargo test --workspace --exclude buffer   # the app crate needs the release recorder and ffmpeg resources, which the installer build creates

      - name: Build installer (fetches and verifies ffmpeg, signs the update package)
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build-installer.ps1 -Sign

      - name: Release notes and update feed (from release-notes/<version>.md)
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis/*_${version}_*.exe | Select-Object -First 1
          $feed = New-Item -ItemType Directory -Force target/release/bundle/feed
          & ./scripts/release-notes.ps1 -Version $version -Installer $installer.FullName `
            -GithubOut "$feed/release-body.md" -AppOut "$feed/app-notes.txt"
          Push-Location $feed
          & "$env:GITHUB_WORKSPACE/scripts/make-latest-json.ps1" -Version $version -Installer $installer.FullName -NotesFile "$feed/app-notes.txt" -Repo "${{ github.repository }}"
          Pop-Location

      - name: Publish release
        if: steps.guard.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis/*_${version}_*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $installer.FullName "$($installer.FullName).sig" target/release/bundle/feed/latest.json `
            --title "Buffer $version" `
            --notes-file target/release/bundle/feed/release-body.md

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
